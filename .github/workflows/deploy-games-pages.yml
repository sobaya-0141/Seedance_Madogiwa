name: Deploy games to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/deploy-games-pages.yml"
      - "GAMES_PORTAL/**"
      - "04_GAME_ASSETS/voxel/models/**"
      - "04_GAME_ASSETS/videos/**"
      - "05_OFFICE_CRASH_GAME/**"
      - "07_SOBA_ESCAPE_GAME/**"
      - "08_ROMANCE_NOVEL_GAME/**"
      - "09_VOXEL_BATTLE_GAME/**"
      - "10_GYUN_GYUN_QUEST_GAME/**"
      - "11_MADOGIWA_ICE_PUZZLE_GAME/**"
      - "12_SOBA_BEER_RUN_GAME/**"
      - "13_COMPANY_BREAKER_GAME/**"
      - "14_MADOGIWA_CARD_GAME/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            05_OFFICE_CRASH_GAME/package-lock.json
            07_SOBA_ESCAPE_GAME/package-lock.json
            08_ROMANCE_NOVEL_GAME/package-lock.json
            09_VOXEL_BATTLE_GAME/package-lock.json
            10_GYUN_GYUN_QUEST_GAME/package-lock.json
            11_MADOGIWA_ICE_PUZZLE_GAME/package-lock.json
            12_SOBA_BEER_RUN_GAME/package-lock.json
            13_COMPANY_BREAKER_GAME/package-lock.json
            14_MADOGIWA_CARD_GAME/package-lock.json

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.0"
          channel: stable
          cache: true

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Build game arcade
        run: node GAMES_PORTAL/scripts/build-pages.mjs

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist-pages

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
